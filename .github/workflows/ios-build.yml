name: iOS build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test control protocol
        run: pnpm test
      - name: Build and sync interface
        run: |
          pnpm build
          pnpm exec cap sync ios
      - name: Check Xcode
        run: xcodebuild -version
      - name: Compile iPhone app without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/coollamp-ios-build.log"
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/coollamp-ios-build.log
          if-no-files-found: ignore
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Build and test app
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm exec cap sync android
      - name: Compile Android app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
