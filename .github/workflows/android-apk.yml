name: Android installable APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Prepare and test app
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
          pnpm exec cap sync android
      - name: Build installable test APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify and package APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/CoolLamp-1.0-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs apk/CoolLamp-1.0-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging apk/CoolLamp-1.0-test.apk
          cd apk
          sha256sum CoolLamp-1.0-test.apk > SHA256SUMS.txt
      - name: Save installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CoolLamp-Android-APK
          path: mobile/apk/
          if-no-files-found: error
          retention-days: 30
