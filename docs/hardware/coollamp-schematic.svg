<text x="45" y="1060" class="small">Encoder front view, shaft toward you and header pointing down: GND, +, SW, DT, CLK (left → right).</text>
<text x="45" y="1090" class="small">R2/R3: 10 kΩ resistors visible onboard. R1 appears unpopulated; SW pull-up and resistor routing unverified.</text>
<text x="45" y="1120" class="small">GPIO1 supplies only the encoder reference at 3.3 V logic. Never connect encoder + or microphone VDD to 5 V.</text>
<text x="45" y="1150" class="small">No added discrete resistors or LED level shifter shown. Power: shared regulated 5 V input and common ground.</text>
<text x="45" y="1180" class="small">Code-compatible wiring proposal; compare CLK/DT direction with prototype. Module internals are not traced here.</text>
<text x="45" y="1215" class="small">2026-09-30 • docs/wiring.md • KiCad PCB review schematic: hardware/pcb/rev-a/CoolLamp-RevA.kicad_sch</text>
